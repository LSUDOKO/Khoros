      - generic [ref=f2e90]:
        - heading "How these agents work" [level=2] [ref=f2e91]
        - generic [ref=f2e92]:
          - paragraph [ref=f2e93]: PancakeSwap V3 concentrates liquidity into a tick interval. Inside the range capital earns fees efficiently; outside it capital efficiency drops to zero while the position stays fully exposed to price movement. Compounding this is loss-versus-rebalancing, where arbitrageurs systematically extract value from stale positions. The agent recentres the range on the current price with width scaled to realised volatility, then restores the inventory ratio so both sides of the pair are working.
          - heading "When it acts" [level=3] [ref=f2e94]
          - paragraph [ref=f2e95]: Rebalance when expected fee gain from a recentred range exceeds gas plus slippage plus LVR over a forward horizon. Price is modelled as jump-diffusion so a volatility spike does not trigger a rebalance that mean reversion would immediately undo. A hard secondary trigger fires whenever price crosses the boundary tick, regardless of the economic calculation.
          - heading "What it is never allowed to do" [level=3] [ref=f2e96]
          - list [ref=f2e97]:
            - listitem [ref=f2e98]: The agent can never move your tokens to another address.
            - listitem [ref=f2e99]: The agent cannot approve a spender outside the allowlist.
          - heading "Checked before every action" [level=3] [ref=f2e100]
          - list [ref=f2e101]:
            - listitem [ref=f2e102]: Swap slippage must stay at or below 50 bps.
            - listitem [ref=f2e103]: New range width must be at least 2%, blocking dust-range griefing.
            - listitem [ref=f2e104]: The resulting position must contain the current price.
            - listitem [ref=f2e105]: No net token outflow from the account.
  - contentinfo [ref=f2e106]:
